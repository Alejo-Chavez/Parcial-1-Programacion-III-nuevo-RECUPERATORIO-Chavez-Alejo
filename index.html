<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecuParcial</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <span class="nombre_fruteria">Frutería</span>
            <div class="busqueda">
                <span id="nav_bar_alumno"></span>
                <!--Acá va el nombre y apellido insertado por JavaScript-->
                <label><input type="text" placeholder="Buscar..." id="barra_busqueda"></label>
            </div>
            <span id="carrito_header">
                <!--span donde se cargara carrito: x productos dinámicamente con JS -->
            </span>
        </nav>
    </header>
    <main>
        <section id="seccion_productos">
            <h2>Nuestras frutas</h2>
            <div id="contenedor_botones">
                <!--Botones cargados dinámicamente con JS-->
            </div>
            <div id="contenedor_productos">
                <!--Productos cargados dinámicamente con JS-->
            </div>
        </section>
        <section>
            <h2>Carrito</h2>
            <div id="contenedor_carrito">
                <!--Carrito cargado dinámicamente con JS-->
            </div>
        </section>
    </main>
    <footer>
        <div id="contenedor_footer">
            <!--Footer dinámico con JS (total y vaciar todos los porductos)-->
        </div>
    </footer>


</body>

</html>
